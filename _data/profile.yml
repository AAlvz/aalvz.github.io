name: Alfonso Álvarez
handle: aalvz
tagline: Platform engineer & builder. I automate processes, in infrastructure and in life.
bio:
  - I'm an SRE / platform engineer who optimizes processes, in systems and in life, and helps teams get more done with DevOps practices.
  - By day I run platform and AI-ops work at scale (Kubernetes, AWS, Terraform, observability), and I build the AI tooling teams share. On the side I build ventures, mostly team-wellness SaaS and local services in Mexico.
  - I've also led people. I had my own team at Tinkerware, and I turned what I learned about healthy teams into the Better Together Framework and Tribu.
  - I work almost entirely in the terminal (Emacs, tmux, Claude Code), which is why this site is one.
  - Off the keyboard I'm a drummer (and I'll get a sound out of any instrument), I learn human languages, I read economics, and I play competitive Smash Bros.

management:
  intro: I've managed my own team, and I've spent years studying what makes teams work. That became the Better Together Framework (the open method) and Tribu (the product that runs it).
  experience:
    - Built and led my own team at Tinkerware.
    - "Designed the Better Together Framework, a 5-radar method for team health: burnout, psychological safety, goal clarity, productivity and work-life balance."
    - Built Tribu to run that framework automatically inside Slack, with pulses, reports and AI insights.
  principles:
    - head: Psychological safety first.
      text: People do their best work when it's safe to speak up and to fail.
    - head: Care personally, challenge directly.
      text: Candid feedback is a form of respect.
    - head: Clear goals beat motivation speeches.
      text: Specific, shared goals are what move a team.
    - head: Emotions are data.
      text: How people feel at work is information, not noise.
    - head: Measure team health like uptime.
      text: What gets measured regularly gets fixed early.
  research: "The science behind BTF: Maslach (burnout), Edmondson and Google's Project Aristotle (psychological safety), Gallup Q12 and Locke & Latham (goals), Self-Determination Theory and Csikszentmihalyi (motivation and flow), WHO and Sonnentag (recovery and balance)."

