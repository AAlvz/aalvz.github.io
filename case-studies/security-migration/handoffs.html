<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="index,follow">
<title>Security Migration Hand-offs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
<style>
/* Layout: a sequence diagram. One vertical lane per actor (shared files, Slack, you, orchestrator, agents, watchers, GitLab); time runs down in five phases; every arrow is one agent's output landing as another's input. A sticky caption above names both ends. */
:root{
  --bg:#f6f4ef; --surface:#ffffff; --ink:#1b2030; --muted:#5d6374; --line:#d6d1c5; --band:#ece8de; --hl:#fbe9dc;
  --you:#c2410c; --orch:#1b2030; --map:#0e7490; --prep:#2f54d9; --watch:#7c3aed; --file:#a16207; --sys:#4b5563;
  --you-bg:#fdeee4; --orch-bg:#e7e9ef; --map-bg:#e2f3f6; --prep-bg:#e6ebfc; --watch-bg:#f0e9fd; --file-bg:#fbf3df; --sys-bg:#eceef1;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11141b; --surface:#191d27; --ink:#e8eaf0; --muted:#9aa1b2; --line:#363d4d; --band:#1f2430; --hl:#2e2219;
  --you:#fb923c; --orch:#e8eaf0; --map:#5fd4e6; --prep:#8ea6ff; --watch:#c4b5fd; --file:#f2c14e; --sys:#aab3c2;
  --you-bg:#2b1c12; --orch-bg:#242a38; --map-bg:#0f2a30; --prep-bg:#1a2140; --watch-bg:#231b3a; --file-bg:#2b2412; --sys-bg:#232833; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11141b; --surface:#191d27; --ink:#e8eaf0; --muted:#9aa1b2; --line:#363d4d; --band:#1f2430; --hl:#2e2219;
  --you:#fb923c; --orch:#e8eaf0; --map:#5fd4e6; --prep:#8ea6ff; --watch:#c4b5fd; --file:#f2c14e; --sys:#aab3c2;
  --you-bg:#2b1c12; --orch-bg:#242a38; --map-bg:#0f2a30; --prep-bg:#1a2140; --watch-bg:#231b3a; --file-bg:#2b2412; --sys-bg:#232833; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4.4vw,46px);line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lede{color:var(--muted);max-width:74ch;margin:6px 0 0}
.lede a{color:inherit}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--prep)}
button:focus-visible{outline:2px solid var(--prep);outline-offset:2px}
button.play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* sticky caption */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .hint{color:var(--muted);font-size:12.5px;margin-left:4px}
.cap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);gap:6px 10px;align-items:stretch;min-height:96px}
.cap .k{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cap .who{grid-column:1/-1;font-size:13px;color:var(--muted)}
.cap .arr{align-self:center;text-align:center;color:var(--muted);font-size:18px}
.end{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--cb);border-radius:9px;padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.end .r{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.end .a{font-weight:600;line-height:1.25}
.end .d{font-size:13px;line-height:1.35}
@media (max-width:640px){.cap{grid-template-columns:1fr}.cap .arr{transform:rotate(90deg)}}
/* diagram */
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
#seq{display:block;width:100%;min-width:960px;height:auto}
.head rect{fill:var(--cb);stroke:var(--c);stroke-width:1.5}
.head{cursor:pointer}
.head text{fill:var(--ink);font-size:13.5px;font-weight:600}
.head .s{fill:var(--muted);font-size:11px;font-weight:400;font-family:var(--mono)}
.head.on rect{stroke-width:3}
.head:focus-visible{outline:none} .head:focus-visible rect{stroke-dasharray:4 3;stroke-width:3}
.life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 5}
.ph rect{fill:var(--band)}
.ph text{fill:var(--ink);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.ph .w{fill:var(--muted);letter-spacing:0;text-transform:none}
.msg{cursor:pointer;transition:opacity .2s}
.msg .hit{fill:transparent}
.msg.sel .hit{fill:var(--hl)}
.msg line{stroke:var(--c);stroke-width:2}
.msg circle{fill:var(--c)}
.msg .lb rect{fill:var(--surface);stroke:var(--line)}
.msg.sel .lb rect{stroke:var(--c);stroke-width:1.5}
.msg .lb text{fill:var(--ink);font-size:12.5px}
.msg .no{fill:var(--muted);font-family:var(--mono);font-size:11px}
#seq.focus .msg.off{opacity:.18}
.msg:focus-visible{outline:none} .msg:focus-visible .hit{fill:var(--band)}
.foot{color:var(--muted);font-size:12.5px}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){.msg{transition:none}}
</style>
</head>
<body>
<nav class="pnav" aria-label="Case study pages"><a href="index.html">Case study</a><a href="roster.html">Agents</a><a href="handoffs.html" aria-current="page">Hand-offs</a><a href="flow-map.html">Flow map</a></nav>
<style>.pnav{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;padding-block:14px 0;max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.pnav a{color:var(--muted)}.pnav a[aria-current]{color:var(--ink);font-weight:600}</style>


<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>Security Migration Hand-offs</h1>
    <p class="lede">Every arrow is one output from the <a href="roster.html">agent roster</a> landing as someone else's input, in the order it happened. Read it top to bottom, press Play, or click a lane's name to see only what that actor sent and received.</p>
  </header>

  <div class="bar">
    <div class="ctrl"><button type="button" class="play" id="play">Play the hand-offs</button><button type="button" id="prev" aria-label="Previous hand-off">←</button><button type="button" id="next" aria-label="Next hand-off">→</button><button type="button" id="all">Show all</button><span class="hint" id="hint"></span></div>
    <div class="cap" id="cap" aria-live="polite"></div>
  </div>

  <figure style="margin:0;display:flex;flex-direction:column;gap:10px">
    <div class="scroll"><svg id="seq" viewBox="0 0 1240 1600" role="img" aria-label="Sequence of hand-offs in the migration across eight lanes: shared files, Slack, me, the orchestrator, mapping agents, group agents, watchers and GitLab. Almost every arrow starts or ends at the orchestrator."></svg></div>
    <figcaption class="foot">Arrows are colored by who sends. Nearly every one starts or ends at the orchestrator: agents never handed work to each other directly, which is how one session could check every hand-off. Companion pages: <a href="roster.html">the agents</a> and <a href="flow-map.html">the flow map</a>. Company, team, repo and channel names are changed.</figcaption>
  </figure>
</div>

<script>
const LANES=[
 {id:"files",l:"Shared files",s:"sheet · map · playbook",c:"--file"},
 {id:"slack",l:"Slack",s:"team channels",c:"--sys"},
 {id:"you",l:"Me",s:"the engineer",c:"--you"},
 {id:"orch",l:"Orchestrator",s:"the main session",c:"--orch"},
 {id:"map",l:"Mapping agents",s:"5 · read-only",c:"--map"},
 {id:"prep",l:"Group agents",s:"7 · open MRs",c:"--prep"},
 {id:"watch",l:"Watchers",s:"51 script jobs",c:"--watch"},
 {id:"gitlab",l:"GitLab",s:"repos · pipelines",c:"--sys"}
];
const X={files:90,slack:245,you:400,orch:565,map:735,prep:885,watch:1035,gitlab:1170};
const PH=[
 {k:"plan",n:"Planning"},{k:"map",n:"Mapping"},{k:"fix",n:"Fixing repos"},{k:"ver",n:"Verifying"},{k:"ship",n:"Shipping"}
];
// one row per hand-off: a = sender, b = receiver, l = arrow label, out = what the sender gives, in = what the receiver gets, who = which agents
const M=[
 {p:"plan",a:"files",b:"orch",l:"96 repos + fix hints",out:"Audit sheet: 96 repos, a guessed fix for each",in:"Audit sheet",who:"The security team's audit, read from a local xlsx copy."},
 {p:"plan",a:"you",b:"orch",l:"how we work",out:"New rules",in:"Approvals and rules",who:"One team group at a time, review before any send, no @-mentions."},
 {p:"map",a:"orch",b:"map",l:"repo lists",out:"Repo lists",in:"Batch repo list · 23 shared-group repos · 9 GitLab groups",who:"Channel mappers (3 runs), shared-group splitter, remaining-groups mapper."},
 {p:"map",a:"gitlab",b:"map",l:"committers, CODEOWNERS",out:"Commit history, maintainers, CODEOWNERS",in:"Committers, CODEOWNERS · Jira projects",who:"Who commits to each repo lately, and which Jira project their tickets belong to."},
 {p:"map",a:"slack",b:"map",l:"channels, past sends",out:"Channel search and message history",in:"Channel search · Earlier sends",who:"Where each team reviews MRs, skipping bot-only and announcement channels."},
 {p:"map",a:"map",b:"orch",l:"owners + review channels",out:"Rows in team-map.md · which repos go to which team",in:"Owners and channels",who:"14 teams and 22 channels, including repos whose path didn't match their owner."},
 {p:"map",a:"orch",b:"files",l:"team map + group plan",out:"Tracker and checkpoint",in:"team-map.md · tracker.md",who:"11 team groups, plus skip lists for inactive and no-CI repos."},
 {p:"fix",a:"orch",b:"prep",l:"group repos + playbook",out:"Group repos and playbook",in:"8 · 5 · 4 · 15 · 11 · 7 · 7 repos, each with the playbook",who:"Seven group agents, two running at a time."},
 {p:"fix",a:"gitlab",b:"prep",l:"CI and bake files",out:"Repository files",in:"CI and bake files",who:"The CI file, the bake file and the legacy scan job: the evidence for picking the change."},
 {p:"fix",a:"prep",b:"gitlab",l:"MRs, one commit each",out:"7 · 5 · 4 · 14 · 10 · 6 · 7 MRs",in:"Merge requests",who:"Each validated twice first: a minimal YAML diff and GitLab's merged config."},
 {p:"fix",a:"prep",b:"orch",l:"result rows + stop reports",out:"Stop reports · template-override finding · manual-build case · 'no change needed'",in:"MRs and result rows",who:"One row per repo: MR, fix, image, arch, pipeline, notes."},
 {p:"fix",a:"you",b:"orch",l:"new rules",out:"New rules",in:"Approvals and rules",who:"Inline the report job on teams' own templates, keep pinned templates, report the deployed image."},
 {p:"fix",a:"orch",b:"files",l:"playbook rule added",out:"Tracker and checkpoint",in:"playbook.md",who:"8 revisions; every later agent started from the newest one."},
 {p:"ver",a:"orch",b:"watch",l:"MRs to watch",out:"MRs to watch",in:"MRs to watch",who:"Pipeline watchers, started after every push and every rebase."},
 {p:"ver",a:"gitlab",b:"watch",l:"pipelines + job logs",out:"Pipelines and job logs",in:"Pipelines and job logs",who:"Head pipeline for the MR's commit, job statuses, the pushed tag and the reported image."},
 {p:"ver",a:"watch",b:"orch",l:"ready / failed",out:"Ready / failed",in:"Green / failed",who:"Green, 0 behind, reported image = pushed tag. Runner failures retried once."},
 {p:"ship",a:"orch",b:"you",l:"DM draft + MR links",out:"DM drafts",in:"DM drafts · MR links to review",who:"One draft per team, previewed in my own DMs before anything is posted."},
 {p:"ship",a:"you",b:"orch",l:"send <team>",out:"Approvals",in:"Approvals and rules",who:"Each team's message approved on its own, after I reviewed its MRs in the browser."},
 {p:"ship",a:"orch",b:"watch",l:"approved message",out:"Approved message and its MR list",in:"Approved message",who:"Send-when-green, when MRs were still running. Otherwise the orchestrator posted directly."},
 {p:"ship",a:"watch",b:"slack",l:"team post",out:"Team post",in:"Team channel",who:"Main message with the repo count, MR links in the thread, posted from my own account."},
 {p:"ship",a:"watch",b:"gitlab",l:"auto-merge",out:"Auto-merge",in:"MRs that need an approval",who:"Set only where a team approval is required, never on MRs that need none."},
 {p:"ship",a:"you",b:"gitlab",l:"merges on my team's repos",out:"Merges on my team's repos",in:"Merge requests",who:"The repos my own team owns, merged by me."},
 {p:"ship",a:"orch",b:"watch",l:"merged MRs",out:"MRs to watch",in:"Merged MRs",who:"Post-merge checks."},
 {p:"ship",a:"gitlab",b:"watch",l:"first main pipeline",out:"Pipelines and job logs",in:"First main pipeline",who:"The report job's output and the scanner's 'Scanning image' line."},
 {p:"ship",a:"watch",b:"orch",l:"verified, or a finding",out:"Verified, or a finding",in:"Green / failed",who:"For example: a green pipeline where the scanner had nothing to scan."},
 {p:"ship",a:"orch",b:"files",l:"tracker + checkpoint",out:"Tracker and checkpoint",in:"tracker.md · project notes",who:"Status per repo and per team, so any session could pick up where the last one stopped."}
];
const LANE=Object.fromEntries(LANES.map(l=>[l.id,l]));
const $=s=>document.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function sv(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;if(parent)parent.append(e);return e;}
function paint(el,id){el.style.setProperty("--c",`var(${LANE[id].c})`);el.style.setProperty("--cb",`var(${LANE[id].c}-bg)`);}
function txt(tag,cls,t){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=t;return e;}

const S=$("#seq"),W=1240,ROW=50,BAND=40,TOP=112;
const gLife=sv("g",{},S),gRows=sv("g",{},S),gHead=sv("g",{},S);
const defs=sv("defs",{},S);
LANES.forEach(l=>{const m=sv("marker",{id:"ah-"+l.id,viewBox:"0 0 10 10",refX:"9",refY:"5",markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"},defs);sv("path",{d:"M0 0 L10 5 L0 10 z",fill:`var(${l.c})`},m);});
// rows
let y=TOP;const rowEls=[];
PH.forEach((ph,pi)=>{
  const b=sv("g",{class:"ph"},gRows);sv("rect",{x:0,y:y,width:W,height:BAND-8},b);
  sv("text",{x:16,y:y+21},b,(pi+1)+" · "+ph.n);
  y+=BAND;
  M.filter(m=>m.p===ph.k).forEach(m=>{
    const i=M.indexOf(m),g=sv("g",{class:"msg",tabindex:"0",role:"button","aria-label":`${i+1}. ${LANE[m.a].l} to ${LANE[m.b].l}: ${m.l}`},gRows);paint(g,m.a);
    sv("rect",{class:"hit",x:0,y:y,width:W,height:ROW},g);
    const cy=y+ROW/2+8,x1=X[m.a],x2=X[m.b],dir=Math.sign(x2-x1);
    sv("text",{class:"no",x:16,y:cy+4},g,String(i+1).padStart(2,"0"));
    sv("line",{x1:x1,y1:cy,x2:x2-dir*6,y2:cy,"marker-end":`url(#ah-${m.a})`},g);sv("circle",{cx:x1,cy:cy,r:4},g);
    const lw=m.l.length*6.7+18,mx=(x1+x2)/2,lb=sv("g",{class:"lb"},g);
    sv("rect",{x:mx-lw/2,y:cy-27,width:lw,height:21,rx:10.5},lb);sv("text",{x:mx,y:cy-12.5,"text-anchor":"middle"},lb,m.l);
    g.addEventListener("click",()=>{stop();select(i,false);});
    g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();stop();select(i,false);}});
    rowEls[i]=g;y+=ROW;});
  y+=8;});
const H=y+16;S.setAttribute("viewBox",`0 0 ${W} ${H}`);
// lanes
const headEls={};
LANES.forEach(l=>{const x=X[l.id];sv("line",{class:"life",x1:x,y1:84,x2:x,y2:H-10},gLife);
  const g=sv("g",{class:"head",tabindex:"0",role:"button","aria-label":"Show only "+l.l},gHead);paint(g,l.id);
  sv("rect",{x:x-68,y:20,width:136,height:58,rx:10},g);sv("text",{x:x,y:45,"text-anchor":"middle"},g,l.l);sv("text",{class:"s",x:x,y:63,"text-anchor":"middle"},g,l.s);
  const go=()=>{stop();focusLane(focus===l.id?null:l.id);};
  g.addEventListener("click",go);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  headEls[l.id]=g;});

// caption
function end(role,laneId,text){const d=document.createElement("div");d.className="end";paint(d,laneId);d.append(txt("span","r",role),txt("span","a",LANE[laneId].l),txt("span","d",text));return d;}
let sel=-1,focus=null,timer=null;
function select(i,scroll){sel=(i+M.length)%M.length;const m=M[sel],ph=PH.find(p=>p.k===m.p);
  rowEls.forEach((r,j)=>r.classList.toggle("sel",j===sel));
  const c=$("#cap");c.innerHTML="";
  c.append(txt("span","k",`Hand-off ${sel+1} of ${M.length} · ${ph.n}`),end("Gives",m.a,m.out),txt("span","arr","→"),end("Gets",m.b,m.in),txt("span","who",m.who));
  if(scroll){const r=rowEls[sel].getBoundingClientRect(),bar=$(".bar").getBoundingClientRect().bottom;if(r.top<bar+8||r.bottom>innerHeight-20)window.scrollBy({top:r.top-bar-90,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}}
function focusLane(id){focus=id;S.classList.toggle("focus",!!id);
  Object.entries(headEls).forEach(([k,g])=>g.classList.toggle("on",k===id));
  let n=0;M.forEach((m,j)=>{const on=!id||m.a===id||m.b===id;rowEls[j].classList.toggle("off",!on);if(on&&id)n++;});
  $("#hint").textContent=id?`Showing ${n} hand-offs to or from ${LANE[id].l}. Click the name again to clear.`:"";}
function stop(){if(timer){clearInterval(timer);timer=null;$("#play").textContent="Play the hand-offs";}}
$("#play").addEventListener("click",()=>{if(timer){stop();return;}$("#play").textContent="Pause";
  const list=()=>M.map((m,j)=>j).filter(j=>!focus||M[j].a===focus||M[j].b===focus);
  const step=()=>{const l=list(),k=l.indexOf(sel);if(k===l.length-1){stop();return;}select(l[k+1]??l[0],true);};
  if(sel===list().slice(-1)[0])sel=-1;step();timer=setInterval(step,3800);});
$("#next").addEventListener("click",()=>{stop();select(sel+1,true);});
$("#prev").addEventListener("click",()=>{stop();select(sel-1,true);});
$("#all").addEventListener("click",()=>{stop();focusLane(null);rowEls.forEach(r=>r.classList.remove("sel"));sel=-1;showIntro();});
function showIntro(){const c=$("#cap");c.innerHTML="";
  c.append(txt("span","k",`${M.length} hand-offs · 5 phases · 8 lanes`),end("Gives","prep","What one actor produced, named as it appears in the Roster's Gives column"),txt("span","arr","→"),end("Gets","orch","What it became for the next actor, named as in its Gets column"),txt("span","who","Click an arrow or press Play to walk through them in order."));}
showIntro();
</script>

</body>
</html>
